<!doctype html>
<html lang="en" data-type="software">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="page-type" content="software"><meta name="site-kind" content="software">
  <meta name="description" content="Find and share rides around UMT.">
  <title>{% block title %}UMT RideShare{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><nav class="navbar navbar-expand-lg container py-3" aria-label="Main navigation">
  <a class="navbar-brand" href="/">UMT<span>RideShare</span></a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
  <div class="collapse navbar-collapse" id="nav"><div class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
    {% if user_id %}<a class="nav-link" href="/dashboard">Overview</a><a class="nav-link" href="/book">Find a ride</a><a class="nav-link" href="/rides">Offer a ride</a><a class="nav-link" href="/garage">Garage</a><a class="nav-link" href="/bookings">Bookings</a><a class="nav-link" href="/profile">Profile</a><form action="/logout" method="post"><button class="btn btn-outline-dark btn-sm" type="submit">Log out</button></form>{% else %}<a class="nav-link" href="/#login">Log in</a><a class="btn btn-dark btn-sm" href="/register">Join RideShare</a>{% endif %}
  </div></div>
</nav></header>
<main id="main">{% block content %}{% endblock %}</main>
<footer class="container site-footer"><span>UMT RideShare</span><span>Move together, around campus.</span></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body></html>

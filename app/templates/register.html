{% extends 'base.html' %}{% block title %}Join · UMT RideShare{% endblock %}{% block content %}<section class="section-pad"><div class="container narrow"><p class="eyebrow">JOIN THE COMMUNITY</p><h1>Create your account.</h1><p>One account for finding seats and sharing rides.</p>{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}<form action="/register" method="post" class="row g-3 mt-2"><div class="col-12"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" required></div><div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" required></div><div class="col-md-6"><label class="form-label" for="phone">Phone</label><input class="form-control" id="phone" name="phone" type="tel" required></div><div class="col-12"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" required></div><div class="col-md-6"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" minlength="8" required></div><div class="col-md-6"><label class="form-label" for="confirm_password">Confirm password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" required></div><div class="col-12"><button class="btn btn-dark" type="submit">Create account</button></div></form></div></section>{% endblock %}

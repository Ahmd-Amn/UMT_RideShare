{% extends 'base.html' %}{% block title %}Profile · UMT RideShare{% endblock %}{% block content %}<section class="section-pad"><div class="container narrow"><p class="eyebrow">YOUR ACCOUNT</p><h1>Profile.</h1><p>Signed in as <strong>{{ user.username }}</strong>.</p><form action="/profile" method="post" class="stack-form mt-4"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" value="{{ user.name }}" required><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" value="{{ user.email }}" required><label class="form-label" for="phone">Phone</label><input class="form-control" id="phone" name="phone" type="tel" value="{{ user.phone }}" required><button class="btn btn-dark mt-3" type="submit">Save profile</button></form></div></section>{% endblock %}
